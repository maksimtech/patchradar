name: Docker Scout CVE Scan
on:
  # Also as soon as a new image is on Docker Hub: until 2026-10-24 the scan, and the
  # Security Posture gate that reads it, kept describing the image a release had
  # replaced until somebody dispatched them by hand.
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types: [completed]
  # The scan reads maksimtech/patchradar:latest from Docker Hub, so it is only
  # meaningful once a new image is published — which happens on a tag, not on a
  # push to main. Without this, re-scanning after a release meant re-running an
  # earlier run by hand.
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '30 4 * * 1'
permissions:
  contents: read
  security-events: write
jobs:
  scout:
    name: Docker Scout
    # After a push that failed, Docker Hub still has the old image: nothing to rescan.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Fetch the Scout binary with the job's token
        # docker/scout-action downloads its binary anonymously and fails with a 403
        # when the runner's shared address has spent GitHub's 60-an-hour budget
        # (docker/scout-action#116). It uses the binary when it is already in place;
        # this puts the one of the pinned version there, checked against its digest
        # (tests/test_scout_binary.py).
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fetch_scout_binary.sh e7e2a72bf1485d10a58f30696b6c513b261ce4fa v1.29.0
      - name: Docker Scout CVE scan
        uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
        with:
          # cves says what is broken in the image; recommendations says
          # whether a base image exists that fixes it. On 2026-09-26 the first
          # scan of exeradar found five HIGH CVEs, all of them in
          # python:3.14-slim-trixie and none in this project's code — which is
          # a fact nobody can act on without the second command.
          command: cves,recommendations
          image: maksimtech/patchradar:latest
          only-severities: critical,high
          exit-code: false
          sarif-file: scout-results.sarif
      - name: Upload Scout results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles('scout-results.sarif') != ''
        with:
          sarif_file: scout-results.sarif

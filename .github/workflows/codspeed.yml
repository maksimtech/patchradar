name: CodSpeed

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allows CodSpeed to trigger backtest performance analysis
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for OpenID Connect authentication with CodSpeed

jobs:
  benchmarks:
    name: Run benchmarks
    # The last job to move to ubuntu-26.04. It stayed on 24.04 when the rest
    # moved on 2026-10-02: CodSpeedHQ/action v5.2.1 failed there with
    # `##[error]Unsupported system` (run 37063015887). CodSpeed's runner and
    # action v5.5.0 (2026-10-14) added Ubuntu 26.04 on x86_64 and arm64:
    # https://github.com/CodSpeedHQ/runner/releases/tag/v5.5.0
    #
    # A named image, never `ubuntu-latest`: that label moves on GitHub's
    # schedule, and a job that breaks then breaks on main at a moment nobody
    # picked (tests/test_runners.py).
    runs-on: ubuntu-26.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        # --group needs pip >= 25.1 to read PEP 735 [dependency-groups]
        run: |
          python -m pip install --upgrade pip
          pip install --group dev -e .  # NOSONAR - trusted internal project, no external setup scripts

      - name: Run benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: simulation
          run: pytest benchmarks/ --codspeed

name: Build and Push Docker Image

on:
  release:
    types: [published]

permissions:
  contents: read
  security-events: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            maksimtech/patchradar:latest
            maksimtech/patchradar:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Docker Scout CVE scan
        uses: docker/scout-action@5dae9c7571dd0f3de81f5b501240c593c13c3eb6 # v1.9.3
        with:
          command: cves
          image: maksimtech/patchradar:${{ steps.version.outputs.VERSION }}
          only-severities: critical,high
          exit-code: false
          sarif-file: scout-results.sarif
      - name: Upload Scout SARIF
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        if: always()
        with:
          sarif_file: scout-results.sarif

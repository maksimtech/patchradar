name: Build and Push Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Already published version to rebuild (e.g. 2026.9.4)'
        required: true

permissions:
  contents: read
  security-events: write

jobs:
  docker:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      # The tag being built, not the default branch. The image is built from this
      # checkout now, so a dispatched rebuild of an older version has to stand on
      # that version's tag — otherwise it would tag main's code with an old
      # release's number. On a release event this is the tag anyway; naming it
      # keeps the two paths the same.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # An image tag and a step output: a release (CalVer, no v), or nothing. A
      # newline in a dispatch input would have added outputs and image tags (#141).
      - name: Extract version
        id: version
        env:
          RAW: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          VERSION="${RAW#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            printf '::error::not a release tag: %q\n' "$RAW"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            maksimtech/patchradar:latest
            maksimtech/patchradar:${{ steps.version.outputs.VERSION }}
          # From the source this tag points at, not from the index.
          #
          # This step used to install patchradar==<the new version> from PyPI while
          # publish.yml was still uploading it. A fixed `sleep 60` lost that race
          # (2026.9.4), polling the index narrowed it, and apkradar still lost it by
          # fifteen seconds on 2026-10-03 — because the poll runs on the runner and
          # the multi-platform build resolves the index again, per platform, from
          # whichever edge answers. Nothing that waits can close that; not asking
          # does.
          #
          # `local` is the branch docker-build-check.yml builds, and that workflow now
          # runs on every push and pull request rather than by hand alone. It had to:
          # this workflow publishes as it builds, so until then the first attempt at
          # building the image was the one that released it.
          build-args: |
            PATCHRADAR_SOURCE=local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Fetch the Scout binary with the job's token
        # docker/scout-action downloads its binary anonymously and fails with a 403
        # when the runner's shared address has spent GitHub's 60-an-hour budget
        # (docker/scout-action#116). It uses the binary when it is already in place;
        # this puts the one of the pinned version there, checked against its digest
        # (tests/test_scout_binary.py). The checkout above is of the version being
        # built, and a version older than the script does not have it: then the
        # action downloads as it always did.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .github/scripts/fetch_scout_binary.sh ]; then
            bash .github/scripts/fetch_scout_binary.sh e7e2a72bf1485d10a58f30696b6c513b261ce4fa v1.29.0
          else
            echo "::warning::this version has no fetch_scout_binary.sh; the action will download its binary itself"
          fi
      - name: Docker Scout CVE scan
        uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
        with:
          command: cves
          image: maksimtech/patchradar:${{ steps.version.outputs.VERSION }}
          only-severities: critical,high
          exit-code: false
          sarif-file: scout-results.sarif
      - name: Upload Scout SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: scout-results.sarif

name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        experimental: [false]
        include:
          - python-version: "3.15-dev"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Without this, tests/test_ui_errors.py and tests/test_csp.py skip on
      # `shutil.which("node") is None` — 34 tests of the web UI, green because
      # they never ran, here and on every developer machine that lacks node. They
      # were added, they were maintained, and they were measuring nothing.
      #
      # The major is pinned to the one the suite is developed against (26.10.0 on
      # 2026-09-29) rather than tracking lts/*: "passes here" and "passes in CI"
      # have to mean the same thing, and a runner silently moving to another major
      # is how they stop meaning it.
      - name: Set up Node (the UI tests need it, and skip without it)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - name: Install dependencies
        # --group needs pip >= 25.1 to read PEP 735 [dependency-groups]
        run: |
          python -m pip install --upgrade pip
          pip install --group dev -e .  # NOSONAR - trusted internal project, no external setup scripts

      - name: Run test suite
        run: pytest tests/ -v --cov=patchradar --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        # Once, not once per matrix entry: the same report four times is four
        # uploads of one measurement. 3.12 is in every Radar's matrix.
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          # A failed upload loses a metric; it does not invalidate the tests that
          # just passed. What it must not do is stay silent forever — ask Codecov
          # whether the report arrived.
          fail_ci_if_error: false

      - name: Test CLI
        run: |
          patchradar --help
          patchradar list

  summary:
    # The branch ruleset needs one check name that survives a change to the
    # matrix. The matrix job cannot be it: its contexts carry the Python version
    # and the experimental flag — "test (3.11, false)" — so they move whenever
    # the matrix does, and a ruleset pinned to them silently stops matching.
    #
    # always(): a skipped required check counts as passed, so this has to run
    # even when the matrix fails, and fail explicitly in that case.
    name: Tests
    needs: [test]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: All test jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || { echo "::error::A required test job ended with: $result"; exit 1; }
          done

name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    # The ruleset of main requires the stable rows under this name
    # (tests/test_python_matrix.py).
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # id-token: write lets the coverage upload prove to Codecov, through GitHub's
    # OIDC, which repository it comes from. Job permissions replace the workflow's,
    # so contents: read is repeated here.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # The same list as the classifiers in pyproject.toml, which
        # tests/test_python_matrix.py checks.
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        experimental: [false]
        include:
          # The next Python, from its development branch, allowed to fail and
          # never a required check: 3.16.0 ships on 2027-10-06 (PEP 826), and a
          # dependency without a wheel for it should show up here first, not
          # after the classifier.
          - python-version: "3.16-dev"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # Without this, tests/test_ui_errors.py and tests/test_csp.py skip on
      # `shutil.which("node") is None` — 34 tests of the web UI, green because
      # they never ran, here and on every developer machine that lacks node. They
      # were added, they were maintained, and they were measuring nothing.
      #
      # The major is pinned to the one the suite is developed against (26.10.0 on
      # 2026-09-29) rather than tracking lts/*: "passes here" and "passes in CI"
      # have to mean the same thing, and a runner silently moving to another major
      # is how they stop meaning it.
      - name: Set up Node (the UI tests need it, and skip without it)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install dependencies
        # --group needs pip >= 25.1 to read PEP 735 [dependency-groups]
        run: |
          python -m pip install --upgrade pip
          pip install --group dev -e .  # NOSONAR - trusted internal project, no external setup scripts

      - name: Run test suite
        run: pytest tests/ -v --cov=patchradar --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        # Once, not once per matrix entry: the same report four times is four
        # uploads of one measurement. 3.12 is in every Radar's matrix.
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # OIDC, not a CODECOV_TOKEN secret: Codecov files an upload under the
          # project its token belongs to, and this repository's secret held
          # exeradar's, so the reports went there (tests/test_codecov_contract.py).
          use_oidc: true
          files: coverage.xml
          # A failed upload loses a metric; it does not invalidate the tests that
          # just passed. What it must not do is stay silent forever — ask Codecov
          # whether the report arrived.
          fail_ci_if_error: false

      - name: Test CLI
        run: |
          patchradar --help
          patchradar list

  summary:
    # The branch ruleset needs one check name that survives a change to the
    # matrix. The matrix job cannot be it alone: its contexts carry the Python
    # version — "Tests (Python 3.11)" — so they move whenever the matrix does,
    # and a ruleset pinned only to them silently stops matching. The ruleset
    # requires this name and each stable row.
    #
    # always(): a skipped required check counts as passed, so this has to run
    # even when the matrix fails, and fail explicitly in that case.
    name: Tests
    needs: [test]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: All test jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || { echo "::error::A required test job ended with: $result"; exit 1; }
          done

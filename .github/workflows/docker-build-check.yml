name: Docker Build Check
# Builds the image from the repository source and runs the smoke test without
# pushing anything. docker.yml cannot serve this purpose: it publishes to
# Docker Hub, including the :latest tag, so it is only safe to run on a
# released version.
# On every change, not only when somebody remembers. While this was reachable by
# hand alone, the only thing that built the image automatically was docker.yml — on
# a release, pushing as it went — so the first attempt at a build was the one that
# published it. That gap closed nothing while the released image installed from the
# index; now that it is built from this source tree, the branch the release takes has
# to be built by something that is not the release.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image from source
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: patchradar:build-check
          build-args: |
            PATCHRADAR_SOURCE=local
      - name: Smoke test (the container user can create the database)
        run: docker run --rm -i --entrypoint python patchradar:build-check - < tests/docker/smoke.py

      # What the image contains, read from the image itself. Piped in the way the
      # smoke test is, because a diagnostic with three levels of nested quoting is
      # a diagnostic that reports its own mistakes. See tests/docker/inspect.sh
      # for why the question matters: a scanner names the source package, and
      # `perl` the source produces both something removable and something
      # Essential.
      - name: What the image contains
        run: docker run --rm -i --entrypoint sh patchradar:build-check - < tests/docker/inspect.sh

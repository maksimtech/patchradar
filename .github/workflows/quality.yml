name: Quality
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  quality:
    # One name, not a matrix: ruff and mypy read their target version from
    # pyproject.toml, so running them on four interpreters would repeat the
    # same answer four times.
    name: Quality
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --group dev -e .  # NOSONAR - trusted internal project, no external setup scripts
      # `tools/` is in here because it was not, and that is where
      # security_exceptions.py lives: the script that refuses a build over an
      # unexplained alert had never been seen by the linter that gates the build.
      # Found on 2026-10-02 by running ruff over the whole tree by hand.
      - name: Lint (ruff)
        # benchmarks/ too: it is code, and it is the one directory the test
        # suite never collects, so lint is the only thing watching it.
        run: ruff check src tests benchmarks scripts tools
      - name: Type check (mypy)
        run: mypy src/patchradar
      # docs/nis2-compliance.md shows uv.lock to a customer as the full list of
      # dependencies. PatchRadar had none until 2026-10-11; this keeps the one it
      # has now from falling behind pyproject.toml. The uv pinned here is the one
      # that wrote the file.
      - name: Lockfile matches pyproject.toml (uv)
        run: |
          python -m pip install "uv==0.12.18"
          uv lock --check

name: SonarCloud Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    # GitHub passes no Actions secrets to Dependabot or fork PRs: there the
    # token is empty and the scan fails with "Not authorized". A step's `if:`
    # cannot read `secrets`, so the job publishes only whether it exists; the
    # token itself stays with the scanner. Those runs still test and build
    # coverage.
    env:
      SONAR_ENABLED: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Here too, and not only in test.yml: this job's pytest run is what produces
      # the coverage Sonar reads, so without node the UI tests skip and the
      # coverage describes a suite smaller than the one that exists. Same pinned
      # major as test.yml, for the same reason.
      - name: Set up Node (the UI tests need it, and skip without it)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - name: Install dependencies
        # --group needs pip >= 25.1 to read PEP 735 [dependency-groups]
        run: |
          python -m pip install --upgrade pip
          pip install --group dev -e .  # NOSONAR - trusted internal project, no external setup scripts

      - name: Run tests with coverage
        run: pytest tests/ --cov --cov-report=xml:coverage.xml

      # `qualitygate.wait` is what makes this job mean something. Without it the
      # step uploads the analysis and succeeds, and SonarCloud decides the gate
      # afterwards: on 2026-09-28 this workflow was green while the gate was ERROR
      # on new_reliability_rating, and the only way to find out was to open
      # sonarcloud.io by hand. With it, a red gate is a red job.
      - name: SonarQube Scan
        if: ${{ env.SONAR_ENABLED == 'true' }}
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

      - name: Report skipped scan
        if: ${{ env.SONAR_ENABLED != 'true' }}
        run: echo "::notice title=SonarCloud skipped::SONAR_TOKEN is not available to this run (Dependabot or fork PR). Tests and coverage ran; the scan runs after merge to main."

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # Taken at least 14 days after release (tests/test_dependabot_config.py);
    # Dependabot's security updates are not subject to the cooldown.
    cooldown:
      default-days: 14
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Taken at least 14 days after release (tests/test_dependabot_config.py);
    # Dependabot's security updates are not subject to the cooldown.
    cooldown:
      default-days: 14
    groups:
      # Every action in one pull request a week, not one per action.
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    # Taken at least 14 days after release (tests/test_dependabot_config.py);
    # Dependabot's security updates are not subject to the cooldown.
    cooldown:
      default-days: 14
    labels:
      - "dependencies"

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # Taken at least 14 days after release (tests/test_dependabot_config.py);
    # Dependabot's security updates are not subject to the cooldown.
    cooldown:
      default-days: 14
    labels:
      - "dependencies"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Security updates only (tests/test_dependabot_config.py): uv.lock had a
    # Dependabot alert and no pull request while no entry read it. A limit of 0
    # stops version updates for uv; it does not limit security updates.
    cooldown:
      default-days: 14
    open-pull-requests-limit: 0
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Taken at least 14 days after release (tests/test_dependabot_config.py);
    # Dependabot's security updates are not subject to the cooldown.
    cooldown:
      default-days: 14
    groups:
      # Every action in one pull request a week, not one per action.
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    # Taken at least 14 days after release (tests/test_dependabot_config.py);
    # Dependabot's security updates are not subject to the cooldown.
    cooldown:
      default-days: 14
    labels:
      - "dependencies"

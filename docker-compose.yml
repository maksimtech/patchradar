services:
  patchradar:
    image: maksimtech/patchradar:latest
    container_name: patchradar
    restart: unless-stopped
    ports:
      # loopback only: without PATCHRADAR_API_KEY the scan and watchlist write
      # endpoints are open, and "8000:8000" published them to the whole network.
      # Set the key in .env before publishing the port beyond this host.
      - "127.0.0.1:8000:8000"
    environment:
      # read from .env (see .env.example); unset or empty means "no key"
      PATCHRADAR_API_KEY: ${PATCHRADAR_API_KEY:-}
      NVD_API_KEY: ${NVD_API_KEY:-}
    volumes:
      # must match the Dockerfile VOLUME: the image runs as the unprivileged
      # `patchradar` user, so the app writes to /home/patchradar/.patchradar
      - patchradar_data:/home/patchradar/.patchradar
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  patchradar_data:
    driver: local

services:
  patchradar:
    image: maksimtech/patchradar:latest
    container_name: patchradar
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - patchradar_data:/root/.patchradar
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  patchradar_data:
    driver: local

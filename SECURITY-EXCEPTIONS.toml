# ─────────────────────────────────────────────────────────────────────────────
# CodeQL findings in our own code, read line by line. Two are false positives of
# a name-based heuristic; the third one CodeQL found was real and has been fixed
# rather than excused (the `<script>` regex of the test harness was
# case-sensitive, so a `<SCRIPT>` would have been skipped in silence and the
# tests would have passed measuring nothing).
# ─────────────────────────────────────────────────────────────────────────────

[[exception]]
id = "py/clear-text-logging-sensitive-data"
source = "CodeQL"
path = "src/patchradar/api/main.py"
where = "api/main.py:69, the warning logged when no API key is configured"
why = """
The expression logs API_KEY_ENV, which is the *name* of the environment variable \
("PATCHRADAR_API_KEY"), never its value — and it is only reached when \
configured_api_key() returns None, that is when there is no key to leak. CodeQL \
flags it because the identifier matches its secret-name heuristic.
"""
review_by = "2026-12-31"

[[exception]]
id = "js/incomplete-multi-character-sanitization"
source = "CodeQL"
path = "tests/js/ui_harness.js"
where = "ui_harness.js:45, the innerHTML setter of the fake DOM"
why = """
It is not a sanitizer. The harness models a browser for the UI tests, and its \
innerHTML setter strips tags to record what the page assigned; no untrusted input \
reaches a real DOM anywhere near it, and the only HTML it ever sees is this \
repository's own index.html. Making it a real sanitizer would change what \
tests/test_ui_errors.py and tests/test_csp.py measure, which is a worse trade \
than an accepted finding.
"""
review_by = "2026-12-31"

# Findings that are open, known, and accepted for now — each with a reason and a
# date. `.github/workflows/security-posture.yml` reads this file: an open high or
# critical alert with no entry here fails the build, an entry past its
# `review_by` fails the build, and an entry that no longer matches anything fails
# the build too, so the record cannot drift away from the product.
#
# The rule this file exists to serve: block on everything we can fix, never block
# on an upstream flaw with no fix available — but write down why, and when that
# will be looked at again. "Hold the release until Debian fixes zlib" sounds
# stricter and is not: Debian marks it *not fixed*, so it would mean never
# shipping our own fixes again.
#
# Fields: id, where, why, review_by are required. `source` narrows an entry to one
# scanner; `path` narrows it to one file, which matters for a rule that can fire
# anywhere — an entry for a CodeQL rule without a path would excuse the next real
# occurrence of it somewhere else.

# ─────────────────────────────────────────────────────────────────────────────
# Debian 13 (trixie) packages of the base image. `apt-get upgrade` already runs
# at build time and the image is rebuilt at every release, so a fix Debian ships
# arrives here without anyone chasing it.
#
# The five below are not the same case, although every scanner prints them the
# same way — "no fix available", one line, no distinction. `patchradar debian`
# reads what the tracker actually says, and on 2026-09-29 it said three different
# things:
#
#   zlib, perl   open in every suite, nothing scheduled anywhere. Waiting is not
#                a plan; the bug number is where evidence goes.
#   attr, acl    fixed in unstable, no-dsa for trixie *because the fix comes in a
#                point release*. Waiting ends at a dated event: rebuild after it.
#
# Two of these entries claimed "no fix published" for attr and acl until that
# check. It was wrong, and wrong in the direction that costs the most: it turned
# a scheduled fix into an indefinite acceptance.
#
# attr has no entry since 2026-11-02, and not because it was fixed: Snyk was the
# only scanner reporting CVE-2026-54371 (Debian bug 1141107, fixed in unstable
# and forky at 1:2.6.0-1, a symlink traversal in recursive getfattr/setfattr,
# which patchradar never runs), and Snyk was retired that day
# (tests/test_workflow_set.py, RETIRED). It is still in the image until the
# trixie point release. acl, if Trivy's image scan reports it, has its entry in
# the Trivy block at the end of this file, with the reason it had under Snyk.
# ─────────────────────────────────────────────────────────────────────────────

[[exception]]
id = "CVE-2026-85091"
source = "Docker Scout"
where = "zlib 1:1.3.dfsg+really1.3.1-1, python:3.14-slim-trixie base image"
why = """
Debian reports no fixed version, in any suite — checked on 2026-09-29 with \
`patchradar debian CVE-2026-85091`: open in bookworm, trixie, sid and forky \
alike, urgency not yet assigned, Debian bug 1146895. There is therefore nothing \
to wait for and nothing to ask for; what moves a flaw in this state is evidence \
on that bug.

Nothing in this repository can close it either: the package comes from the base \
image, apt-get upgrade already runs at build, and the image is rebuilt at every \
release, so the fix arrives the day Debian ships one. Reachability is not \
established either way — patchradar uses zlib only through Python's own zlib \
module for HTTP decompression, never on attacker-chosen archives.
"""
review_by = "2026-12-31"

[[exception]]
id = "CVE-2026-82560"
source = "Docker Scout"
where = "perl-base 5.40.1-6+deb13u1, python:3.14-slim-trixie base image"
why = """
Debian reports no fixed version ("not fixed"), and it cannot be removed either. \
Measured inside the built image on 2026-09-29, by tests/docker/inspect.sh in \
docker-build-check.yml: the only real package is `perl-base`, essential=yes \
priority=required, which dpkg itself depends on. `perl`, `perl-modules` and \
`perlapi-5.40.*` appear in dpkg-query output as virtual packages that perl-base \
provides, with no version of their own — the full `perl` is not installed. Scout \
names the source package, which is why it reads as `perl`.

So this one is ours to record and not ours to close. The date is for re-reading \
whether Debian has published a fix, not for trying the removal again.

Docker Scout stopped reporting it at 2026-09-29T15:26:56Z, so the gate lists this \
entry as settled. It is kept anyway, and the distinction is the whole point: the \
five entries removed on 2026-10-02 went quiet because the thing they described left \
the image. This one went quiet on its own, and it went quiet *earlier* than they \
did, which is not the deciding fact. `patchradar debian CVE-2026-82560` on \
2026-10-02 still reports perl no-dsa in trixie at 5.40.1-6+deb13u1, no fix in any \
suite, Debian bug 1148455 — perl-base is still installed and still unfixed, and \
only the reporting changed. Scout has already changed its mind about this exact id \
once, which is why the gate reads closed alerts at all. Deleting a flaw that is \
demonstrably present because a scanner fell silent is the one direction this file \
must not drift in.

And there is no fix to wait for yet: `patchradar debian CVE-2026-82560` on \
2026-09-29 reports it open in all four suites, including sid at 5.42.3-1, with \
Debian bug 1148455. Unlike attr and acl below, nothing is scheduled.
"""
review_by = "2026-12-31"

# ─────────────────────────────────────────────────────────────────────────────
# Five entries stood here until 2026-10-02: CVE-2026-57585 and
# GHSA-6v7p-g79w-8964 (one msgpack copy under two ids), CVE-2025-47273,
# CVE-2026-24049 and CVE-2026-23949 — all copies vendored inside pip and
# setuptools in the *published* image, which a pin could not reach because the
# vulnerable copies live under `pip/_vendor/` and `setuptools/_vendor/` and an
# explicit install only adds a second, patched copy beside them.
#
# The Dockerfile removed the build tooling from the runtime image on 2026-09-28,
# and each entry said it would close when the next image was published. It was:
# GitHub closed all five at 2026-09-30T17:25:27Z, one timestamp, and Docker Scout
# has not mentioned any of them since. So they are gone, and their return would
# mean the removal regressed — which `tests/docker/inspect.sh` is now the only
# thing watching for, since it is what proved the absence in the first place on
# 2026-09-29: pip, setuptools and wheel all absent from the image built out of
# this repository, measured inside it rather than expected.
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# CodeQL findings in our own code, read line by line. Two are false positives of
# a name-based heuristic; the third one CodeQL found was real and has been fixed
# rather than excused (the `<script>` regex of the test harness was
# case-sensitive, so a `<SCRIPT>` would have been skipped in silence and the
# tests would have passed measuring nothing).
# ─────────────────────────────────────────────────────────────────────────────

[[exception]]
id = "py/clear-text-logging-sensitive-data"
source = "CodeQL"
path = "src/patchradar/api/main.py"
where = "api/main.py:69, the warning logged when no API key is configured"
why = """
The expression logs API_KEY_ENV, which is the *name* of the environment variable \
("PATCHRADAR_API_KEY"), never its value — and it is only reached when \
configured_api_key() returns None, that is when there is no key to leak. CodeQL \
flags it because the identifier matches its secret-name heuristic.
"""
review_by = "2026-12-31"

[[exception]]
id = "js/incomplete-multi-character-sanitization"
source = "CodeQL"
path = "tests/js/ui_harness.js"
where = "ui_harness.js:45, the innerHTML setter of the fake DOM"
why = """
It is not a sanitizer. The harness models a browser for the UI tests, and its \
innerHTML setter strips tags to record what the page assigned; no untrusted input \
reaches a real DOM anywhere near it, and the only HTML it ever sees is this \
repository's own index.html. Making it a real sanitizer would change what \
tests/test_ui_errors.py and tests/test_csp.py measure, which is a worse trade \
than an accepted finding.
"""
review_by = "2026-12-31"



# Findings that are open, known, and accepted for now — each with a reason and a
# date. `.github/workflows/security-posture.yml` reads this file: an open high or
# critical alert with no entry here fails the build, an entry past its
# `review_by` fails the build, and an entry that no longer matches anything fails
# the build too, so the record cannot drift away from the product.
#
# The rule this file exists to serve: block on everything we can fix, never block
# on an upstream flaw with no fix available — but write down why, and when that
# will be looked at again. "Hold the release until Debian fixes zlib" sounds
# stricter and is not: Debian marks it *not fixed*, so it would mean never
# shipping our own fixes again.
#
# Fields: id, where, why, review_by are required. `source` narrows an entry to one
# scanner; `path` narrows it to one file, which matters for a rule that can fire
# anywhere — an entry for a CodeQL rule without a path would excuse the next real
# occurrence of it somewhere else.

# ─────────────────────────────────────────────────────────────────────────────
# Debian 13 (trixie) packages of the base image. `apt-get upgrade` already runs
# at build time and the image is rebuilt at every release, so a fix Debian ships
# arrives here without anyone chasing it.
#
# The five below are not the same case, although every scanner prints them the
# same way — "no fix available", one line, no distinction. `patchradar debian`
# reads what the tracker actually says, and on 2026-09-29 it said three different
# things:
#
#   zlib, perl   open in every suite, nothing scheduled anywhere. Waiting is not
#                a plan; the bug number is where evidence goes.
#   attr, acl    fixed in unstable, no-dsa for trixie *because the fix comes in a
#                point release*. Waiting ends at a dated event: rebuild after it.
#
# Two of these entries claimed "no fix published" for attr and acl until that
# check. It was wrong, and wrong in the direction that costs the most: it turned
# a scheduled fix into an indefinite acceptance.
# ─────────────────────────────────────────────────────────────────────────────

[[exception]]
id = "CVE-2026-85091"
source = "Docker Scout"
where = "zlib 1:1.3.dfsg+really1.3.1-1, python:3.14-slim-trixie base image"
why = """
Debian reports no fixed version, in any suite — checked on 2026-09-29 with \
`patchradar debian CVE-2026-85091`: open in bookworm, trixie, sid and forky \
alike, urgency not yet assigned, Debian bug 1146895. There is therefore nothing \
to wait for and nothing to ask for; what moves a flaw in this state is evidence \
on that bug.

Nothing in this repository can close it either: the package comes from the base \
image, apt-get upgrade already runs at build, and the image is rebuilt at every \
release, so the fix arrives the day Debian ships one. Reachability is not \
established either way — patchradar uses zlib only through Python's own zlib \
module for HTTP decompression, never on attacker-chosen archives.
"""
review_by = "2026-12-31"

[[exception]]
id = "SNYK-DEBIAN13-ZLIB-19520500"
source = "Snyk Container"
where = "zlib, python:3.14-slim-trixie base image"
why = "The same zlib package as CVE-2026-85091, reported by the other scanner."
review_by = "2026-12-31"

[[exception]]
id = "CVE-2026-82560"
source = "Docker Scout"
where = "perl-base 5.40.1-6+deb13u1, python:3.14-slim-trixie base image"
why = """
Debian reports no fixed version ("not fixed"), and it cannot be removed either. \
Measured inside the built image on 2026-09-29, by tests/docker/inspect.sh in \
docker-build-check.yml: the only real package is `perl-base`, essential=yes \
priority=required, which dpkg itself depends on. `perl`, `perl-modules` and \
`perlapi-5.40.*` appear in dpkg-query output as virtual packages that perl-base \
provides, with no version of their own — the full `perl` is not installed. Scout \
names the source package, which is why it reads as `perl`.

So this one is ours to record and not ours to close. The date is for re-reading \
whether Debian has published a fix, not for trying the removal again.

And there is no fix to wait for yet: `patchradar debian CVE-2026-82560` on \
2026-09-29 reports it open in all four suites, including sid at 5.42.3-1, with \
Debian bug 1148455. Unlike attr and acl below, nothing is scheduled.
"""
review_by = "2026-12-31"

[[exception]]
id = "SNYK-DEBIAN13-ATTR-17678182"
source = "Snyk Container"
where = "attr 1:2.5.2-3, python:3.14-slim-trixie base image"
why = """
CVE-2026-54371. Not "no fix published", which is what this entry said until \
2026-09-29 and what Snyk's one line implies: read through \
`patchradar debian CVE-2026-54371`, Debian has fixed it in unstable and forky \
(attr 1:2.6.0-1) and filed it no-dsa for trixie with the note "Will be fixed \
first in unstable, then point release update; not to be backported by individual \
patches" — Debian bug 1141107.

So the fix is scheduled, not absent, and the only thing to do is rebuild after \
the next trixie point release. The date below is set for that and not for a \
yearly re-read: if the point release has happened and the image still reports \
this, the rebuild did not happen. The flaw itself is a symlink traversal in \
recursive getfattr/setfattr, which patchradar never runs.
"""
review_by = "2026-11-30"

[[exception]]
id = "SNYK-DEBIAN13-ACL-17677866"
source = "Snyk Container"
where = "acl 2.3.2-2, python:3.14-slim-trixie base image"
why = """
CVE-2026-54369 and CVE-2026-54370, both Debian bug 1141110, both in the same \
position as attr above: fixed in unstable and forky (acl 2.4.0-1), no-dsa for \
trixie with the fix scheduled for a point release. Debian's own note says why it \
cannot be backported piecemeal — the fix adds the `acl_*_at()` ABI of 2.4.0.

A local TOCTOU in recursive setfacl/chacl and symlink-following in \
`acl_*_file()`; patchradar calls neither. Rebuild after the point release.
"""
review_by = "2026-11-30"

# ─────────────────────────────────────────────────────────────────────────────
# Copies vendored inside pip and setuptools in the *published* image. Fixed in
# the Dockerfile on 2026-09-28 by removing the build tooling from the runtime
# image — a pin could not reach them, because the vulnerable copies live under
# `pip/_vendor/` and `setuptools/_vendor/` and an explicit install adds a second,
# patched copy beside them. Docker Scout reads maksimtech/patchradar:latest from
# Docker Hub, so these five close when the next image is published and not
# before. The short date is deliberate: if they are still here after it, the
# publish did not happen or the fix did not work, and both are worth knowing.
#
# That the fix works is no longer an expectation: on 2026-09-29
# tests/docker/inspect.sh reported pip, setuptools and wheel all absent from the
# image built out of this repository, on Linux, inside the image itself.
# ─────────────────────────────────────────────────────────────────────────────


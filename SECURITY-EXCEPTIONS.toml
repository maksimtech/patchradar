[[exception]]
id = "CVE-2026-119373"
source = "Trivy"
where = "sqlite3 3.46.1-7+deb13u2 (libsqlite3-0), python slim-trixie base image"
why = """
SQLite before 3.54.0: an FTS5 heap buffer overflow in fts5MergeRowidLists() (OSV, 2026-11-02). One of the eleven sqlite3 \
issues the Debian package tracker lists as open in both trixie and sid, so there is \
no fixed version in any suite yet; the +deb13u2 in the image did not close it. \
Docker Scout reports it too (below).

patchradar does use SQLite: src/patchradar/db/database.py (through aiosqlite) keeps its data through Python's sqlite3 \
module, in a database file it creates itself. What it does not use is where these \
flaws are: its schema has no FTS5 table and it loads no extension, and Python's \
sqlite3 module exposes no Session Extension (checked on 2026-11-02). Reaching FTS5 \
would take a database file someone else wrote, opened in place of its own. It waits for Debian, and the release after Debian \
ships a fix carries it.
"""
review_by = "2026-12-31"


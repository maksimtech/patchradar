sonar.projectKey=maksimtech_patchradar
sonar.organization=maksimtech
sonar.projectName=PatchRadar
sonar.python.version=3.11, 3.12, 3.13, 3.14
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*
sonar.exclusions=**/__pycache__/**,**/*.pyc

# Coverage comes from the Sonar workflow's pytest-cov run.
sonar.python.coverage.reportPaths=coverage.xml
# Only what that report cannot measure: the page's JS and HTML (covered by the
# Node harness in tests/js, which produces no lcov). Python stays in coverage.
sonar.coverage.exclusions=src/patchradar/api/static/**,src/patchradar/api/templates/**

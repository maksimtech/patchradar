[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchradar"
version = "2026.8.34"
description = "Realtime CVE intelligence for your software stack"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "maksimtech", email = "github@maksimtech.com"}
]
keywords = ["cve", "security", "vulnerability", "monitoring", "patch-tuesday"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "httpx>=0.28.1",
    "fastapi>=0.141.0",
    "uvicorn>=0.52.0",
    "typer>=0.27.0",
    "rich>=15.0.0",
    "pydantic>=2.13.0",
    "apscheduler>=3.11.0",
    "aiosqlite>=0.22.0",
]

[project.scripts]
patchradar = "patchradar.cli:main"

[project.urls]
Homepage = "https://github.com/maksimtech/patchradar"
Repository = "https://github.com/maksimtech/patchradar"
Issues = "https://github.com/maksimtech/patchradar/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/patchradar"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "if __name__ == .__main__."]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-codspeed (>=5.0.3,<6.0.0)",
    "pytest-cov (>=6.0.0,<8.0.0)"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchradar"
version = "2026.9.6"
description = "Realtime CVE intelligence for your software stack"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "maksimtech", email = "github@maksimtech.com"}
]
keywords = ["cve", "security", "vulnerability", "monitoring", "patch-tuesday"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "httpx>=0.28.1",
    "fastapi>=0.141.0",
    "uvicorn>=0.52.0",
    "typer>=0.27.0",
    "rich>=15.0.0",
    "pydantic>=2.13.0",
    "apscheduler>=3.11.0",
    "aiosqlite>=0.22.0",
]

[project.scripts]
patchradar = "patchradar.cli:main"

[project.urls]
Homepage = "https://github.com/maksimtech/patchradar"
Repository = "https://github.com/maksimtech/patchradar"
Issues = "https://github.com/maksimtech/patchradar/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/patchradar"]

[tool.coverage.run]
source = ["src"]
# Paths in coverage.xml relative to the checkout, so SonarCloud can map them.
relative_files = true
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "if __name__ == .__main__."]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-codspeed (>=5.0.3,<6.0.0)",
    "pytest-cov (>=6.0.0,<8.0.0)",
    "respx (>=0.22.0,<0.23.0)",
    "ruff (>=0.16,<1.0)",
    "mypy (>=1.18,<3.0)",
    "hypothesis (>=6.140,<7.0)",
    "mutmut (>=3.8,<4.0)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Useful without being noisy. The security ruleset S is deliberately absent:
# ruff's S rules *are* flake8-bandit — measured on 2026-09-24, S110 and B110
# reported the same four try-except-pass — so selecting it here would report
# every finding twice, under two ids, in two places to be archived.
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# B008 objects to a function call in an argument default, and Typer's entire
# API is exactly that: `def cmd(x: str = typer.Option(...))`. There is no fix
# on this side — moving the call into the body would stop Typer seeing the
# option at all — so the two calls are declared immutable instead.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
# A test may import for a side effect, or redefine a fixture name to make the
# case read; neither is a defect there.
"tests/*" = ["F811", "E402"]

[tool.mypy]
python_version = "3.11"
# Not strict mode: apscheduler ships no py.typed, so strict would spend its
# errors on the untyped edge rather than on this code — and an error that cannot
# be acted on teaches the reader to ignore the tool.
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Tests assert against deliberately malformed input; annotating that would
# describe the fixtures rather than check the code.
module = "tests.*"
ignore_errors = true

[tool.mutmut]
source_paths = ["src"]
pytest_add_cli_args_test_selection = ["tests/"]
# mutmut 3.8 refuses to run on Windows and points at WSL, so this is a CI-only
# configuration: the scheduled workflow runs it on ubuntu.
do_not_mutate = ["src/patchradar/__init__.py"]

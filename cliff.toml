[changelog]
header = """
# Changelog\n
All notable changes to PatchRadar are documented here.\n
"""
body = """
{% if version %}\
## {{ version }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/maksimtech/patchradar/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
    { message = "^feat", group = "✨ Features" },
    { message = "^fix", group = "🐛 Bug Fixes" },
    { message = "^security", group = "🔒 Security" },
    { message = "^docs", group = "📄 Documentation" },
    { message = "^chore", group = "🔧 Maintenance" },
    { message = "^ci", group = "⚙️ CI/CD" },
    { message = "^test", group = "🧪 Tests" },
    { message = "^refactor", group = "♻️ Refactoring" },
]
filter_commits = false
tag_pattern = "[0-9]{4}\\.[0-9]+\\.[0-9]+"
